# Firebase App Hosting configuration for the Next.js UI (ui/)
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_API_URL
    # Update with your deployed Cloud Run backend URL before deploying
    value: https://carthij-api-REPLACE_ME.run.app
    availability:
      - BUILD
      - RUNTIME
